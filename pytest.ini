[pytest]
# По умолчанию pytest не спускается в каталоги с именем «build» (считает их
# сборочным мусором) — но у нас importer/tests/build/ это пакет тестов
# мок-клиента LegalX/SudX (Задача 3 мастер-плана), а не артефакты сборки.
# Список — реальный дефолт pytest (_pytest/main.py, get_dirs_from_args ->
# default_norecursedirs: '*.egg .* _darcs build CVS dist node_modules venv
# {arch}') без «build»; всё остальное, включая «venv» (питоновские
# виртуальные окружения — не путать с «dist», сборкой Vite), оставлено как
# было — не расширяем и не сужаем список произвольно.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch}
