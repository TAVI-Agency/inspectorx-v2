# CI витрины и конвейера (этап 1 плана фотоконтроля, §8: «CI, которого нет»).
# Три независимые ноги: фронт+API (lint, типы, тесты), Python-конвейер (pytest),
# линт миграций (supabase db lint на локальном стеке).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: lint + typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  importer:
    name: pytest importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: importer/requirements.txt
      - run: pip install -r importer/requirements.txt
      # integration-тесты сами себя скипают без поднятого локального Supabase
      - run: python -m pytest importer/tests -q

  db-lint:
    name: supabase db lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db lint
