# Тиры моделей generic-агентов Build-конвейера (ADR-0003, Задача 13).
#
# Стартовые значения — преамбула "Блок 2" мастер-плана
# (docs/superpowers/plans/2026-08-02-master-plan-1.md). Финальный выбор
# моделей — по данным трейсинга (Задача 29), НЕ заранее: не менять тиры без
# этих данных.
#
# `expensive` — не отдельная модель у OpenAI, а gpt-5 с высоким
# reasoning-effort; здесь у неё свой ключ тира/модели, потому что агентам
# нужно различать её от `mid` (обычный gpt-5) при выборе модели по тиру.
tiers:
  cheap: gpt-5-mini
  mid: gpt-5
  expensive: gpt-5-high-reasoning

# Прайс-таблица для будущего трейсинга и подсчёта стоимости по ролям
# (Задача 29: pipeline.llm_calls.cost_usd). usd за 1M токенов.
#
# ЗНАЧЕНИЯ — ПЛЕЙСХОЛДЕРЫ (порядок величин публичного прайса OpenAI на
# момент написания), уточнить по актуальному прайс-листу API перед тем, как
# полагаться на них в биллинге.
pricing:
  gpt-5-mini:
    input_per_1m_usd: 0.25
    output_per_1m_usd: 2.0
  gpt-5:
    input_per_1m_usd: 1.25
    output_per_1m_usd: 10.0
  gpt-5-high-reasoning:
    # Токены стоят столько же, сколько у обычного gpt-5 — дороже она не по
    # цене токена, а по тому, что high reasoning тратит больше output-токенов
    # на рассуждения (уточнить фактическую разницу в Задаче 29 по трейсингу).
    input_per_1m_usd: 1.25
    output_per_1m_usd: 10.0
